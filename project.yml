# Generates AIBrief.xcodeproj (app + widget extension). Run: ./scripts/make-xcode-project.sh
name: AIBrief
options:
  bundleIdPrefix: com.mmfreitas
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Apple ID team used for signing.
    DEVELOPMENT_TEAM: VC3335VCQD
    ENABLE_HARDENED_RUNTIME: YES

packages:
  AIBriefPackage:
    path: .

targets:
  AIBriefApp:
    type: application
    platform: macOS
    sources: [Sources/BriefApp]
    dependencies:
      - package: AIBriefPackage
        product: BriefCore
      - target: AIBriefWidget
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: AI Brief
        LSApplicationCategoryType: public.app-category.productivity
        # Background app: no Dock icon. The widget and menu bar icon are the way in.
        LSUIElement: true
        # Both targets read this to find the shared folder (see BriefStore).
        AppGroupIdentifier: $(TeamIdentifierPrefix)com.mmfreitas.aibrief
        CFBundleURLTypes:
          - CFBundleURLName: com.mmfreitas.aibrief
            CFBundleURLSchemes: [aibrief]
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.mmfreitas.aibrief]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmfreitas.aibrief
        PRODUCT_NAME: AI Brief

  AIBriefWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: AIBriefPackage
        product: BriefCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: AI Brief
        AppGroupIdentifier: $(TeamIdentifierPrefix)com.mmfreitas.aibrief
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.mmfreitas.aibrief]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mmfreitas.aibrief.widget
        PRODUCT_NAME: AIBriefWidget
        SKIP_INSTALL: YES

schemes:
  AIBrief:
    build:
      targets:
        AIBriefApp: all
        AIBriefWidget: all
    run:
      config: Debug
      executable: AIBriefApp
